name: Refresh ranked jobs

on:
  workflow_dispatch: {}
  schedule:
    # Every day at 03:30 UTC
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-ranked-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome (for Selenium)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Run pipeline (scrape + rank)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CI: "1"
        run: |
          python app/main.py

      - name: Upload debug artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug
          path: |
            data/ci_debug/*

      - name: Commit updated JSON (if changed)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh ranked jobs"
          file_pattern: "frontend/data/ranked_jobs.json data/ranked_jobs.json"

