name: Refresh ranked jobs

on:
  workflow_dispatch: {}
  schedule:
    # Every day at 03:30 UTC
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-ranked-jobs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Reuse pip wheel cache between runs (invalidates when requirements.txt changes).
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Google Chrome (for Selenium)
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Run pipeline (scrape + rank)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CI: "1"
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then echo "ANTHROPIC_API_KEY is set"; else echo "ANTHROPIC_API_KEY is MISSING"; fi
          if [ -n "${OPENAI_API_KEY}" ]; then echo "OPENAI_API_KEY is set"; else echo "OPENAI_API_KEY is MISSING"; fi
          python app/main.py

      - name: Upload debug artifacts (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-debug
          path: |
            data/ci_debug/*

      - name: Commit updated JSON (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only frontend/data/ is tracked; repo-root /data/ is gitignored (local scrape output).
          for f in frontend/data/ranked_jobs.json frontend/data/last_refresh.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore: refresh ranked jobs"
            git push
          fi

